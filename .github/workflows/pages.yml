# Publica la vista previa estática del sitio en GitHub Pages.
#
# GitHub Pages no ejecuta PHP: este flujo corre index.php con los datos de
# ejemplo (demo/ejemplo.php) y sube el HTML resultante. Se reconstruye cada
# día para que «Hoy», «Mañana» y «En 3 días» sigan siendo correctos.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # 00:17 en Santiago (horario de verano)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, iconv
          coverage: none

      - name: Construir la página estática
        env:
          TZ: America/Santiago
        run: php -d date.timezone=America/Santiago herramientas/construir-estatico.php _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
